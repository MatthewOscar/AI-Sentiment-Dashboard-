<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Sentiment Dashboard</title>
    <meta
      name="description"
      content="See the feeling behind each part of a sentence. The AI Sentiment Dashboard highlights which parts of a message are positive, negative, or neutral, not just one overall label."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Sentiment Dashboard" />
    <meta
      property="og:description"
      content="See the feeling behind each part of a sentence, not just one overall label."
    />
    <meta property="og:url" content="https://ai-sentiment-dashboard.netlify.app/" />
    <meta property="og:image" content="https://ai-sentiment-dashboard.netlify.app/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Sentiment Dashboard" />
    <meta
      name="twitter:description"
      content="See the feeling behind each part of a sentence, not just one overall label."
    />
    <meta name="twitter:image" content="https://ai-sentiment-dashboard.netlify.app/og.png" />
    <script>
      // Resolve the theme before first paint to avoid a flash:
      // use the stored choice, otherwise the device preference.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
